app = "bidrakartan"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  VIBE_ORIGIN = "https://console.vibecloud.se"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    grace_period = "8s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
